name: Build dsfork kernel (CONFIG_USER_NS)

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  KERNEL_TAG: "20260522"
  EXPECTED_RELEASE: "5.10.252-ztc1997-star0-dsfork-android12-9-00288-ga2f1cf2027f2"
  ORIGINAL_ZIP: "https://github.com/Star-ZER0/android_gki_kernel_5.10_common/releases/download/20260522/AnyKernel3-android12-5.10.252-2026-04_r1-ztc1997-star0-dsfork-noroot-release-20260522.zip"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Clone kernel source at tag 20260522
        run: |
          git clone --depth 1 --branch 20260522 \
            https://github.com/Star-ZER0/android_gki_kernel_5.10_common kernel
          git -C kernel rev-parse HEAD

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex cpio kmod lz4 xz-utils zstd \
            libssl-dev libelf-dev libncurses-dev \
            python3 zip unzip curl ca-certificates git

      - name: Check memory / ensure swap available
        run: |
          echo "== memory before build =="; free -h
          swapon --show || true
          if ! swapon --show 2>/dev/null | grep -q swapfile; then
            sudo mkswap -f /swapfile 2>&1 || true
            sudo swapon /swapfile 2>&1 || echo "(swapon skipped)"
          fi
          echo "== memory after =="; free -h

      - name: Download AOSP clang r416183b
        run: |
          cd kernel
          mkdir -p toolchain
          ok=0
          for url in \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/mirror-goog-main-llvm-toolchain-source/clang-r416183b.tar.gz" ; do
            echo "trying $url"
            if curl -fL --retry 3 -o clang.tar.gz "$url"; then ok=1; break; fi
          done
          [ "$ok" = 1 ]
          tar -xzf clang.tar.gz -C toolchain
          toolchain/bin/clang --version | head -1
          echo "$PWD/toolchain/bin" >> "$GITHUB_PATH"

      - name: Patch config (ThinLTO + exact version string + USER_NS)
        run: |
          cd kernel
          DEFCONFIG=arch/arm64/configs/gki_defconfig
          sed -i 's/^CONFIG_LTO_CLANG_FULL=y$/CONFIG_LTO_CLANG_THIN=y/' "$DEFCONFIG"
          sed -i 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-ztc1997-star0-dsfork-android12-9-00288-ga2f1cf2027f2"/' "$DEFCONFIG"
          sed -i '/^CONFIG_LOCALVERSION_AUTO=/d' "$DEFCONFIG"
          printf '# CONFIG_LOCALVERSION_AUTO is not set\n' >> "$DEFCONFIG"
          sed -i '/^# CONFIG_USER_NS is not set/d' "$DEFCONFIG" || true
          printf '\nCONFIG_USER_NS=y\n' >> "$DEFCONFIG"
          grep -nE "CONFIG_LTO_CLANG|CONFIG_LOCALVERSION|CONFIG_USER_NS" "$DEFCONFIG"

      - name: Generate gki_defconfig and verify
        run: |
          cd kernel
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out gki_defconfig
          grep -q '^CONFIG_USER_NS=y' out/.config && echo "OK: USER_NS" || { echo "FAIL: USER_NS"; exit 1; }
          grep -q '^CONFIG_LTO_CLANG_THIN=y' out/.config && echo "OK: ThinLTO" || { echo "FAIL: ThinLTO"; exit 1; }
          grep -q "^CONFIG_LOCALVERSION=\"-ztc1997-star0-dsfork-android12-9-00288-ga2f1cf2027f2\"$" out/.config && echo "OK: LOCALVERSION" || { echo "FAIL: LOCALVERSION"; exit 1; }

      - name: Build kernel Image
        run: |
          cd kernel
          date -u +"start compile: %F %T"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- O=out -j"$(nproc)" Image
          date -u +"finish compile: %F %T"
          echo "== built kernel release string =="
          cat out/include/config/kernel.release
          test "$(cat out/include/config/kernel.release)" = "${{ env.EXPECTED_RELEASE }}" && echo "OK: version string matches official release" || { echo "FAIL: version string mismatch"; exit 1; }
          ls -la out/arch/arm64/boot/Image

      - name: Repack AnyKernel3 zip (replace Image only)
        run: |
          cd kernel
          curl -fL -o original.zip "${{ env.ORIGINAL_ZIP }}"
          python3 - <<'EOF'
          import shutil, zipfile
          shutil.copy('original.zip', 'release.zip')
          tmp = 'release_new.zip'
          with zipfile.ZipFile('release.zip', 'r') as zin, \
               zipfile.ZipFile(tmp, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  data = zin.read(item.filename)
                  if item.filename == 'Image':
                      data = open('out/arch/arm64/boot/Image','rb').read()
                      print(f'replaced Image ({len(data)} bytes)')
                  zout.writestr(item, data)
          shutil.move(tmp, 'release.zip')
          EOF
          mv release.zip "AnyKernel3-5.10.252-dsfork-userns-20260522.zip"
          ls -la *.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-dsfork-userns
          path: kernel/AnyKernel3-5.10.252-dsfork-userns-20260522.zip
          if-no-files-found: error
